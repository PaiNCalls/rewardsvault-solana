[package]
name = "rewards_vault"
version = "0.1.0"
description = "On-chain split + custody of the bot's trading fee (Solana port of RewardsVault.sol)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rewards_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
