name: anchor-ci

on:
  push:
  workflow_dispatch:

env:
  ANCHOR_VERSION: 1.1.2

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.avm
            target
          key: modern-anchor${{ env.ANCHOR_VERSION }}-solana-stable-v3

      - name: Install Solana CLI (Agave stable)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Solana version
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: Install Anchor via avm (cached across runs)
        run: |
          if ! command -v avm >/dev/null 2>&1; then
            cargo install --git https://github.com/solana-foundation/anchor avm --force
          fi
          avm install ${ANCHOR_VERSION}
          avm use ${ANCHOR_VERSION}
          anchor --version

      - name: Install surfpool (Anchor 1.x test validator — prebuilt binary)
        run: |
          curl -sSfL https://github.com/txtx/surfpool/releases/latest/download/surfpool-linux-x64.tar.gz -o /tmp/surfpool.tar.gz
          tar xzf /tmp/surfpool.tar.gz -C /tmp
          sudo install -m 0755 "$(find /tmp -maxdepth 2 -name surfpool -type f | head -1)" /usr/local/bin/surfpool
          surfpool --version

      - name: Provider wallet
        run: solana-keygen new --no-bip39-passphrase --force -o ~/.config/solana/id.json

      - name: Install node deps
        run: npm install

      - name: anchor build (generates the program keypair)
        run: anchor build

      - name: Sync declared program id to the built keypair, then rebuild
        run: |
          anchor keys sync
          anchor keys list
          anchor build

      - name: anchor test (deploy to a local validator + run the suite)
        run: anchor test --skip-build
