name: anchor-ci

on:
  push:
  workflow_dispatch:

env:
  SOLANA_VERSION: v1.18.26
  ANCHOR_VERSION: 0.30.1

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned for Anchor 0.30.1)
        uses: dtolnay/rust-toolchain@1.79.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: anchor-${{ env.ANCHOR_VERSION }}-solana-${{ env.SOLANA_VERSION }}-rust179-${{ hashFiles('**/Cargo.toml') }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Solana version
        run: solana --version

      - name: Install Anchor CLI (direct, locked — skips avm)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} anchor-cli --locked --force
          anchor --version

      - name: Generate a local keypair + sync program id
        run: |
          solana-keygen new --no-bip39-passphrase --force -o ~/.config/solana/id.json
          anchor keys sync
          echo "program id:" && anchor keys list

      - name: Install node deps
        run: npm install

      - name: anchor build
        run: anchor build

      - name: anchor test (spins a local validator)
        run: anchor test
