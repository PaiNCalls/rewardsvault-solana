name: anchor-ci

on:
  push:
  workflow_dispatch:

env:
  SOLANA_VERSION: v1.18.26
  ANCHOR_VERSION: 0.30.1

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (host resolver — needs edition2024 support)
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: toolchain-anchor${{ env.ANCHOR_VERSION }}-solana${{ env.SOLANA_VERSION }}-rust179

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Solana version
        run: solana --version

      - name: Install Anchor CLI (direct, locked — skips avm; cached across runs)
        run: |
          if ! command -v anchor >/dev/null 2>&1; then
            cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} anchor-cli --locked
          fi
          anchor --version

      - name: Provider wallet
        run: solana-keygen new --no-bip39-passphrase --force -o ~/.config/solana/id.json

      - name: Install node deps
        run: npm install

      - name: anchor build (generates the program keypair)
        run: anchor build

      - name: Sync declared program id to the built keypair, then rebuild
        run: |
          anchor keys sync
          anchor keys list
          anchor build

      - name: anchor test (deploy to a local validator + run the suite)
        run: anchor test --skip-build
