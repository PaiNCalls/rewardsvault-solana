name: deploy-mainnet

# Manual only — deploys the program to Solana mainnet and initialises the vault.
on:
  workflow_dispatch:

env:
  ANCHOR_VERSION: 1.1.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.avm
            target
          key: modern-anchor${{ env.ANCHOR_VERSION }}-solana-stable-v3

      - name: Install Solana CLI (Agave stable)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor via avm (cached)
        run: |
          if ! command -v avm >/dev/null 2>&1; then
            cargo install --git https://github.com/solana-foundation/anchor avm --force
          fi
          avm install ${ANCHOR_VERSION}
          avm use ${ANCHOR_VERSION}
          anchor --version

      - name: Write deploy keypair + point at mainnet
        env:
          KP: ${{ secrets.SOLANA_DEPLOY_KEYPAIR }}
          RPC: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          mkdir -p ~/.config/solana
          printf '%s' "$KP" > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json
          solana config set --url "$RPC" --keypair ~/.config/solana/id.json
          echo "deploy wallet: $(solana address)"
          echo "balance: $(solana balance)"

      - name: Build + sync program id
        run: |
          anchor build
          anchor keys sync
          anchor build
          echo "program keypair:" && anchor keys list

      - name: Deploy to mainnet
        env:
          RPC: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          anchor deploy --provider.cluster "$RPC" --provider.wallet ~/.config/solana/id.json

      - name: Install node deps
        run: npm install

      - name: Initialise the vault (and read state back)
        env:
          RPC: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          ANCHOR_PROVIDER_URL="$RPC" ANCHOR_WALLET="$HOME/.config/solana/id.json" \
            npx ts-node -T -P tsconfig.json scripts/init.ts

      - name: Leftover balance
        run: |
          echo "deploy wallet leftover: $(solana balance)"
